name: Lo probé en mi proyecto
description: Cuéntanos cómo te fue al instalarla e integrarla, aunque todo haya salido bien.
labels: [adopción]
body:
  - type: markdown
    attributes:
      value: |
        Esta librería todavía no tiene casos de uso fuera de Nexus. Tu experiencia, buena o mala, es lo que más ayuda a estabilizarla.
        Si algo falló, usa mejor «Reportar un error».
  - type: input
    id: version
    attributes:
      label: Versión de nexus-expediente
      placeholder: '0.5.1'
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: ¿Con qué la usaste?
      options: [JavaScript / TypeScript, Vue, React, Angular, CDN (script), Migrando desde SweetAlert2, Otro]
    validations:
      required: true
  - type: textarea
    id: que
    attributes:
      label: ¿Qué resolviste con ella?
      description: Qué diálogos o formularios, y en qué tipo de aplicación (sin datos sensibles).
    validations:
      required: true
  - type: textarea
    id: tiempo
    attributes:
      label: ¿Cuánto tardaste en tener el primer diálogo funcionando y qué te frenó?
      description: Sirve para saber si «Primeros pasos» alcanza o falta algo.
  - type: textarea
    id: falta
    attributes:
      label: ¿Qué te faltó o qué cambiarías?
